<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<title>Promech Service · Gestión</title>
<link rel="icon" id="favicon" href="">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Promech">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="application-name" content="Promech">
<meta name="description" content="Promech Service – Clients, quotes & work orders · Clientes, cotizaciones y órdenes de trabajo · Clients, devis et ordres de travail · Clientes, orçamentos e ordens de trabalho">
<style>
:root{
  --ch:#1f2328; --ch2:#2b3036; --ch3:#3a4047;
  /* Verde industrial: --brand para logotipo/líneas decorativas; --ac (texto blanco AA 4.8:1) para botones; --ac2 para hover y texto sobre blanco */
  --brand:#1e9e50; --ac:#168342; --ac2:#116b36; --ac-soft:#e9f6ee;
  --bg:#f2f3f5; --card:#fff; --line:#e2e5e9; --txt:#1f2328; --muted:#6b7280;
  --red:#c62828; --red-soft:#fdecec; --ok:#0f766e; --ok-soft:#e0f2f1; --blue:#1565c0; --blue-soft:#e8f0fb;
  --amber:#a15c00; --amber-soft:#fff4dc; --grey-soft:#eef0f2; --purple:#6a3fb5; --purple-soft:#f1ebfb;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:var(--ac2)}
h1,h2,h3{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow","Segoe UI",sans-serif;letter-spacing:.2px;margin:0}
h1{font-size:28px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:12.5px} .r{text-align:right} .nowrap{white-space:nowrap}
.pre{white-space:pre-wrap}
.topbar{background:var(--ch);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 0 var(--brand)}
.topbar-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.topbar-row{display:contents}
.brand{display:flex;align-items:center;flex:0 0 auto;text-decoration:none;order:1}
.hdr-tools{order:3;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.hdr-tools select{width:auto;background:var(--ch2);color:#fff;border:1px solid #3a4047;padding:5px 6px;font-size:13px;border-radius:7px}
.user-chip{color:#cfd4da;font-size:13px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.user-chip b{color:#fff;font-weight:600}
.btn.hdr{background:transparent;border:1px solid #4a5058;color:#e5e7eb;padding:5px 10px;font-size:13px}
.btn.hdr:hover{background:var(--ch2)}
.btn.hdr .lo-i{display:none}
.brand svg{height:42px;width:auto;display:block}
.brand .custom-logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex;align-items:center}
.brand .custom-logo img{height:32px;max-width:170px;object-fit:contain;display:block}
.nav{order:2;display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:#cfd4da;text-decoration:none;padding:8px 13px;border-radius:8px;font-weight:600;font-size:14.5px;white-space:nowrap}
.nav a:hover{background:var(--ch2);color:#fff}
.nav a.active{background:var(--ac);color:#fff}
.container{max-width:1240px;margin:0 auto;padding:22px 18px 40px}
.foot{max-width:1240px;margin:0 auto;padding:0 18px 28px;color:var(--muted);font-size:12.5px;text-align:center}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.card h2{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:9px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;background:var(--grey-soft);color:var(--txt);text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--ac);color:#fff}
.btn.primary:hover{background:var(--ac2);filter:none}
.btn.dark{background:var(--ch);color:#fff}
.btn.ghost{background:#fff;border-color:var(--line)}
.btn.danger{background:#fff;border-color:#f1c4c4;color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.xs{padding:4px 8px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:var(--grey-soft);color:var(--txt)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--txt);background:#fff;border:1px solid #cfd4da;border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(22,131,66,.35);border-color:var(--ac)}
input:disabled{background:var(--grey-soft);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:#4b5563;text-transform:uppercase;letter-spacing:.3px}
label.f > input,label.f > select,label.f > textarea,label.f > div{text-transform:none;letter-spacing:0;font-weight:400}
.grid{display:grid;gap:12px 14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2} .span3{grid-column:span 3} .spanall{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--txt);cursor:pointer;white-space:nowrap}
.chk input{width:auto}
.vat-row{display:flex;align-items:center;gap:8px}
.vat-row input[type=number]{width:80px}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:18px 0 8px;font-family:inherit}
.toolbar{display:flex;gap:10px;padding:12px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 240px}
.toolbar select{flex:0 1 190px;width:auto}
.table-wrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
table.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr:hover td{background:#fcfcfd}
table.list tr.overdue td{background:var(--red-soft)}
table.list tr.overdue td:first-child{box-shadow:inset 4px 0 0 var(--red)}
table.list tr.overdue:hover td{background:#fbe1e1}
.strong{font-weight:600}
.doc-no{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:13.5px;white-space:nowrap}
.inline-status{width:auto;padding:4px 8px;font-size:13px;border-radius:999px;font-weight:600}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--grey-soft);color:#4b5563}
.b-prospect,.b-draft,.b-received,.b-low{background:var(--grey-soft);color:#4b5563}
.b-contacted,.b-sent,.b-in_progress,.b-normal{background:var(--blue-soft);color:var(--blue)}
.b-quoted,.b-ready,.b-high{background:var(--amber-soft);color:var(--amber)}
.b-active,.b-accepted,.b-delivered{background:var(--ok-soft);color:var(--ok)}
.b-lost,.b-rejected{background:var(--red-soft);color:var(--red)}
.b-qc{background:var(--purple-soft);color:var(--purple)}
.b-urgent,.b-overdue{background:var(--red);color:#fff}
.b-example{background:#fff3c4;color:#7a5b00;border:1px dashed #d9b400}
.tag-red{color:var(--red);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;position:relative;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;display:block}
.stat:hover{border-color:#cdd2d8}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ch3)}
.stat.ac::before{background:var(--brand)} .stat.red::before{background:var(--red)} .stat.ok::before{background:var(--ok)}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:34px;font-weight:800;line-height:1.1;margin-top:4px;font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif}
.stat.red .v{color:var(--red)}
.stat .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.dash-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mini-list li:last-child{border-bottom:0}
.mini-list .date{flex:0 0 86px;font-size:13px;font-weight:700}
.mini-list .grow{flex:1;min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.welcome{padding:26px;display:flex;gap:24px;align-items:center;margin-bottom:18px;background:linear-gradient(120deg,#fff 0%,#fff 60%,var(--ac-soft) 100%)}
.welcome svg{width:84px;height:84px;flex:0 0 auto}
.welcome .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backup-note{font-size:13px;color:var(--muted);margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.backup-note.warn{color:var(--amber)}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;font-size:13px;color:var(--muted)}
.list-head b{color:var(--txt)}
.more-wrap{text-align:center;margin-top:12px}
.lead-meta{font-size:12px;color:var(--muted);margin-top:2px}
/* Número de cliente permanente (#012): pequeño y discreto */
.client-no{font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.3px;white-space:nowrap}
table.list tr{position:relative}
table.list .client-no{position:absolute;top:3px;right:10px}
table.list td.actions-cell{padding-top:18px}
.modal-head h2 .client-no{font-size:12px;margin-left:6px;vertical-align:middle}
.step-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.proc-mail{margin-top:1px}
.field-link{font-size:12px;font-weight:400;margin-top:3px;display:inline-block}
#by-country{margin-top:18px}
.country-chips{display:flex;flex-wrap:wrap;gap:8px}
.country-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--txt);text-decoration:none;font-size:13.5px;background:#fafbfc}
.country-chip b{color:var(--ac);font-variant-numeric:tabular-nums}
.country-chip:hover{border-color:var(--ac);background:var(--ac-soft)}
.web-link{font-size:12.5px;word-break:break-all}
/* Pantalla de acceso */
body.locked #app{display:none}
#auth-root{display:none}
body.locked #auth-root{display:block}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ch);padding:20px;background-image:linear-gradient(160deg,#1f2328 0%,#1f2328 55%,#173d27 100%)}
.auth-card{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:24px 24px 20px;border-top:5px solid var(--brand);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.auth-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.auth-top svg{width:200px;height:auto;display:block}
.auth-top select{width:auto;font-size:13px;padding:5px 6px}
.auth-card h1{font-size:24px;margin:4px 0 4px}
.auth-card .grid{margin-top:14px;grid-template-columns:minmax(0,1fr)}
.auth-card .chk{white-space:normal;align-items:flex-start;line-height:1.35}
.auth-card .chk input{margin-top:2px;flex:0 0 auto}
.auth-err{color:var(--red);font-weight:600;font-size:13.5px;min-height:20px;margin-top:8px}
.auth-note{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.notice{background:var(--blue-soft);color:#1e3a5f;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
body.modal-open{overflow:hidden}
.modal-backdrop{position:fixed;inset:0;background:rgba(17,20,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:4px solid var(--brand)}
.modal.wide{max-width:1000px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 12px 12px;position:sticky;bottom:0}
.items{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.item-head,.item-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 100px 130px 130px 36px;gap:8px;align-items:center;padding:8px 10px}
.item-head{background:#fafbfc;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.item-row{border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:0}
/* Foto de la pieza en la línea */
.i-descwrap{display:flex;align-items:center;gap:8px;min-width:0}
.i-descwrap .i-desc{flex:1 1 auto;min-width:0}
.i-photo{position:relative;flex:0 0 auto;display:flex}
.photo-add{width:38px;height:38px;padding:0;border:1px dashed #b4bcc8;border-radius:8px;background:#fafbfc;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.photo-add:hover,.photo-add:focus-visible{border-color:var(--ac);color:var(--ac);background:var(--ac-soft)}
.photo-thumb{width:56px;height:56px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:zoom-in;background:#fff;display:block}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:-8px;right:-8px;width:24px;height:24px;padding:0;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--red);font-size:16px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.photo-del:hover{background:var(--red-soft)}
.item-row.photo-busy .i-photo{opacity:.45;pointer-events:none}
.item-row.drag-over{outline:2px dashed var(--ac);outline-offset:-3px;background:var(--ac-soft)}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(10,12,15,.86);display:flex;align-items:center;justify-content:center;padding:5vh 4vw;cursor:zoom-out}
.lightbox img{width:min(900px,100%);height:auto;max-height:100%;object-fit:contain;border-radius:6px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox .lb-close{position:absolute;top:12px;right:12px;background:#fff;color:var(--txt);width:40px;height:40px;border-radius:50%}
.photo-note{margin-top:10px;font-size:12.5px;line-height:1.45;color:#6b4e00;background:#fff8e1;border:1px solid #f1dc9a;border-radius:8px;padding:8px 10px}
/* Foto en el PDF: ~30 mm, el texto fluye al lado */
table.doc-items img.doc-photo{float:left;width:30mm;height:auto;max-height:30mm;object-fit:contain;margin:0 3mm 1mm 0;border:1px solid #e5e7eb;border-radius:2px;background:#fff}
table.doc-items tr{break-inside:avoid;page-break-inside:avoid}
.i-amount{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.totals{margin:12px 0 16px auto;max-width:340px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:5px 2px;font-size:14.5px}
.totals .grand{border-top:2px solid var(--ch);margin-top:4px;padding-top:8px;font-size:18px;font-weight:800}
.settings-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.logo-box{border:1px dashed #cfd4da;border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:110px;background:#fafbfc;margin-bottom:10px}
.logo-box img{max-height:90px;max-width:100%}
.logo-box svg{height:72px;width:auto;max-width:100%}
.data-btns{display:flex;flex-direction:column;gap:8px}
.data-btns .btn{justify-content:flex-start}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ch);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:4px solid var(--brand);max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Vista de impresión / PDF */
#print-root{display:none}
body.print-mode{background:#d9dce0}
body.print-mode #app,body.print-mode #modal-root{display:none}
body.print-mode #print-root{display:block}
.print-toolbar{position:sticky;top:0;z-index:5;background:var(--ch);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 0 var(--brand)}
.print-toolbar .hint{color:#cfd4da;font-size:13px}
.sheet{background:#fff;width:210mm;max-width:calc(100% - 24px);min-height:297mm;margin:20px auto;padding:14mm 14mm 12mm;box-shadow:0 6px 30px rgba(0,0,0,.18);color:#1f2328;font-size:12.5px;line-height:1.45;display:flex;flex-direction:column}
.doc-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:12px;border-bottom:3px solid var(--brand)}
.doc-logo svg{width:250px;height:auto;display:block}
.doc-logo img{max-width:250px;max-height:90px;display:block}
.doc-company{text-align:right;font-size:11.5px;color:#374151}
.doc-company strong{font-size:15px;color:var(--ch);display:block;font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;letter-spacing:.3px}
.doc-titlebar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:18px 0 14px}
.doc-titlebar h1{font-size:30px;letter-spacing:2px;color:var(--ch)}
.doc-titlebar .draft{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:1px;color:var(--red);border:1.5px solid var(--red);padding:2px 6px;border-radius:4px;vertical-align:middle;font-family:"Segoe UI",Arial,sans-serif}
table.meta{border-collapse:collapse;font-size:12px}
table.meta td{padding:2px 0 2px 14px}
table.meta td:first-child{color:#6b7280;text-align:right}
table.meta td:last-child{font-weight:700;text-align:right}
.doc-client{background:#f6f7f8;border-left:4px solid var(--ch);padding:10px 14px;margin-bottom:16px}
.doc-client .label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#6b7280;font-weight:700;margin-bottom:2px}
.doc-client strong{font-size:14px}
table.doc-items{width:100%;border-collapse:collapse;font-size:12px}
table.doc-items th{background:var(--ch);color:#fff;text-align:left;padding:7px 8px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
table.doc-items td{padding:7px 8px;border-bottom:1px solid #e5e7eb;vertical-align:top}
table.doc-items tr:nth-child(even) td{background:#fafafa}
table.doc-items .r{text-align:right;white-space:nowrap}
.doc-totals{display:flex;justify-content:flex-end;margin-top:10px}
.doc-totals table{border-collapse:collapse;min-width:260px;font-size:12.5px}
.doc-totals td{padding:4px 8px}
.doc-totals td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc-totals tr.grand td{background:var(--ac);color:#fff;font-weight:800;font-size:14.5px;padding:8px}
.doc-block{margin-top:16px;page-break-inside:avoid}
.doc-block h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ch);border-bottom:1px solid #e5e7eb;padding-bottom:3px;margin-bottom:6px;font-family:"Segoe UI",Arial,sans-serif}
.doc-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;page-break-inside:avoid}
.doc-sign div{border-top:1px solid #9ca3af;padding-top:5px;font-size:11px;color:#6b7280}
.doc-foot{margin-top:auto;padding-top:14px;border-top:1px solid #e5e7eb;font-size:10.5px;color:#6b7280;text-align:center}
@media print{
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-mode{background:#fff}
  .no-print,#toast,.lightbox,.photo-add,.photo-del,.i-file{display:none!important}
  body.print-mode #app,body.print-mode #modal-root{display:none!important}
  .sheet{box-shadow:none;margin:0;padding:0;width:auto;max-width:none;min-height:calc(297mm - 26mm)}
}
@media (max-width:1050px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash-grid,.settings-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .topbar-inner{flex-direction:column;align-items:stretch;gap:8px;padding:8px 12px}
  .topbar-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .user-chip{max-width:110px;min-width:0}
  .uc-l{display:none}
  .hdr-tools{min-width:0;flex:0 1 auto;gap:6px}
  .hdr-tools .btn.hdr{padding:5px 8px}
  .brand svg{height:32px}
  .nav{margin-left:0}
  .nav a{padding:7px 11px;font-size:14px}
  .nav .long{display:none}
  .container{padding:16px 12px 32px}
  h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat .v{font-size:28px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .span3{grid-column:1/-1}
  .toolbar select{flex:1 1 140px}
  table.list thead{display:none}
  table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
  table.list tr{border-bottom:1px solid var(--line);padding:8px 4px}
  table.list tr:last-child{border-bottom:0}
  table.list td{border:0;padding:4px 10px;display:flex;gap:10px;justify-content:space-between;text-align:right}
  table.list td::before{content:attr(data-label);font-size:11.5px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;flex:0 0 34%}
  table.list td > div{text-align:right}
  table.list td.actions-cell::before{content:none}
  table.list td.actions-cell{padding-top:4px}
  table.list td.company-cell{padding-top:18px}
  table.list .client-no{top:8px;right:14px}
  table.list td.actions-cell .actions{justify-content:flex-start;width:100%;margin-top:4px}
  table.list tr.overdue td,table.list tr.overdue:hover td{background:transparent}
  table.list tr.overdue td:first-child{box-shadow:none}
  table.list tr.overdue{box-shadow:inset 4px 0 0 var(--red);background:var(--red-soft)}
  .item-head{display:none}
  .item-row{grid-template-columns:1fr 1fr 1fr 36px;row-gap:6px}
  .item-row .i-descwrap{grid-column:1/-1}
  .photo-thumb{width:48px;height:48px}
  .photo-add{width:42px;height:42px}
  .item-row .i-amount{grid-column:1/4;text-align:right}
  .item-row .i-amount::before{content:attr(data-label) ": ";color:var(--muted);font-weight:400}
  .item-row .del{grid-row:3;grid-column:4}
  .modal-backdrop{padding:0}
  .modal{border-radius:0;min-height:100%}
  .modal-foot{border-radius:0}
  .welcome{flex-direction:column;align-items:flex-start;padding:18px}
  .sheet{padding:16px;min-height:0;font-size:11.5px;margin:12px auto}
  .doc-head{flex-direction:column}
  .doc-company{text-align:left}
  .doc-logo svg{width:200px}
  .doc-titlebar{flex-direction:column;gap:8px}
}
@media screen and (max-width:760px){
  table.doc-items{font-size:10.5px}
  table.doc-items th{padding:6px 4px;font-size:9px;letter-spacing:0}
  table.doc-items td{padding:6px 4px}
  table.doc-items th:first-child,table.doc-items td:first-child{width:14px !important}
  table.doc-items img.doc-photo{width:15mm;max-height:15mm;margin-right:2mm}
}
@media (max-width:520px){ .btn.hdr .lo-t{display:none} .btn.hdr .lo-i{display:block} .btn.hdr{padding:6px 7px} }
@media (max-width:420px){
  .nav a{padding:7px 8px;font-size:13.5px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2{grid-column:auto}
}
</style>

   Clientes creados por el usuario: a partir de 151, por fecha de creación. clientSeq guarda el máximo asignado (los huecos se respetan). */

function assignClientNumbers(s){

  s.clients.forEach(c => { if (c.no || !c.lead) return; const L = LEAD_BY_NAME.get(normName(c.company)); if (L && !used.has(L.no)) { c.no = L.no; used.add(L.no); } });

/* Importar las minas incluidas como prospectos (omitiendo duplicados por nombre de empresa).
   minV: solo las minas de versiones del dataset posteriores a minV (actualización automática de dispositivos que ya tenían las 90). */
function importLeads(minV = 0){
  const existing = new Set(state.clients.map(c => normName(c.company)));
  const used = new Set(state.clients.map(c => c.no).filter(Boolean));
  const now = new Date().toISOString(); let added = 0, skipped = 0;
  for (const L of LEADS) {
    if ((L.v || 1) <= minV) continue;
    const k = normName(L.company);
    if (existing.has(k)) { skipped++; continue; }
    existing.add(k);
    const no = used.has(L.no) ? nextClientNo() : L.no; used.add(no);
    state.clients.push({ id:uid(), no, company:L.company, site:L.site, country:L.country, countryOther:'', contact:'', email:L.email, emailProc:L.emailProc || '', phone:L.phone,
      website:L.web, minerals:L.minerals, status:'prospect', nextStep:'', nextDate:'', notes:L.notes, lead:true, createdAt:now, updatedAt:now });
    added++;
  }
  state.clientSeq = Math.max(state.clientSeq || 0, LEADS.length, ...state.clients.map(c => c.no || 0));
  state.flags.leadsImported = true; state.flags.leadsVersion = LEADS_VERSION;
  return { added, skipped };
}
/* Correos de los prospectos ya importados (dispositivos con la versión anterior):
   - si el principal sigue siendo el de compras que puso la v1 (sin editar), pasa a «Email de compras» y se restaura el general;
   - solo se rellenan campos de correo VACÍOS; nunca se sobrescribe lo que el usuario editó. */
function refreshLeadEmails(){
  let n = 0;
  for (const c of state.clients) {
    if (!c.lead) continue;
    const L = LEAD_BY_NAME.get(normName(c.company)); if (!L) continue;
    const before = c.email + '|' + c.emailProc + '|' + c.notes;
    const lc = s => String(s || '').trim().toLowerCase();
    if (L.email1 && lc(c.email) === lc(L.email1)) {
      if (!c.emailProc && lc(L.emailProc) === lc(c.email)) c.emailProc = c.email;
      c.email = L.email || '';
      if (L.other1 && c.notes) c.notes = c.notes.replace('\nOtro email: ' + L.other1, '');
    }
    if (!c.email && L.email) c.email = L.email;
    if (!c.emailProc && L.emailProc) c.emailProc = L.emailProc;
    if (before !== c.email + '|' + c.emailProc + '|' + c.notes) { c.updatedAt = new Date().toISOString(); n++; }
  }
  return n;
}
/* Arranque: primera vez → todas las minas; dispositivos con una versión anterior → solo las nuevas, una vez
   (las que el usuario borró no se vuelven a añadir solas; solo con el botón de Ajustes). */
function upgradeLeads(){
  if (!state.flags.leadsImported) { importLeads(0); return true; }
  const v = state.flags.leadsVersion || 1;
  if (v >= LEADS_VERSION) return false;
  importLeads(v); refreshLeadEmails();
  return true;
}

function nextNumber(kind){

  const prefix = `${pre}-${new Date().getFullYear()}-`;
  const list = kind === 'quote' ? state.quotes : state.orders;
  let max = state.counters[prefix] || 0;
  list.forEach(x => { if (x.number && x.number.startsWith(prefix)) { const n = parseInt(x.number.slice(prefix.length), 10); if (n > max) max = n; } });
  return { number: prefix + String(max + 1).padStart(4, '0'), prefix, n: max + 1 };

/* SHA-256 de respaldo (si crypto.subtle no está disponible, p. ej. algunos navegadores con file://) */
function sha256Fallback(bytes){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, withPad = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(withPad); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(withPad - 4, (l * 8) >>> 0); dv.setUint32(withPad - 8, Math.floor(l / 0x20000000));
  const w = new Uint32Array(64), r = (x,n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < withPad; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i*4);
    for (let i = 16; i < 64; i++) { const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3), s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10); w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0, t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map(x => x.toString(16).padStart(8,'0')).join('');
}
async function sha256Hex(str){
  const data = new TextEncoder().encode(str);
  if (window.crypto && crypto.subtle && crypto.subtle.digest) { try { const buf = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join(''); } catch(e){} }
  return sha256Fallback(data);
}
const hashPassword = (pw, salt) => sha256Hex(salt + ':' + pw);
const findUserByName = name => auth.users.find(u => normName(u.name) === normName(name));
const isAdmin = () => !!currentUser && currentUser.role === 'admin';
async function makeUser(name, pw, role){ const salt = randomHex(16); return { id:uid(), name:name.trim(), role, salt, hash: await hashPassword(pw, salt), createdAt:new Date().toISOString() }; }
function restoreSession(){
  let id = null; try { id = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY); } catch(e){}
  currentUser = id ? auth.users.find(u => u.id === id) || null : null;
}
function startSession(u, remember){
  currentUser = u;
  try { sessionStorage.setItem(SESSION_KEY, u.id); if (remember) localStorage.setItem(SESSION_KEY, u.id); else localStorage.removeItem(SESSION_KEY); } catch(e){}
  document.body.classList.remove('locked'); $('#auth-root').innerHTML = ''; render();
}
function logout(){
  try { sessionStorage.removeItem(SESSION_KEY); localStorage.removeItem(SESSION_KEY); } catch(e){}
  currentUser = null; closeModal(); if (document.body.classList.contains('print-mode')) closePrint();
  renderAuth(); toast(t('auth.loggedOut'));
}
function renderAuth(){
  document.body.classList.add('locked'); document.documentElement.lang = LANG;
  document.title = 'Promech Service';
  const setup = auth.users.length === 0;
  $('#auth-root').innerHTML = `<div class="auth-wrap"><div class="auth-card" id="auth-card">
    <div class="auth-top">${svgSized(LOGO_FULL)}${langSelect('auth-lang')}</div>
    <h1>${esc(setup ? t('auth.setupTitle') : t('auth.loginTitle'))}</h1>
    <div class="muted small">${esc(setup ? t('auth.setupIntro') : t('auth.loginIntro'))}</div>
    <form id="auth-form" autocomplete="on"><div class="grid">
      ${field(t('auth.name'), `<input name="name" required maxlength="60" autocomplete="username" autocapitalize="words">`)}
      ${field(t('auth.password'), `<input name="password" type="password" required minlength="${setup ? 6 : 1}" autocomplete="${setup ? 'new-password' : 'current-password'}">`)}
      ${setup ? field(t('auth.password2'), `<input name="password2" type="password" required minlength="6" autocomplete="new-password">`) : `<label class="chk"><input type="checkbox" name="remember"> ${esc(t('auth.remember'))}</label>`}
    </div>
    <div class="auth-err" id="auth-err" role="alert"></div>
    <button class="btn primary" type="submit" style="width:100%;margin-top:6px">${esc(setup ? t('auth.createAdmin') : t('auth.login'))}</button></form>
    <div class="auth-note">${esc(setup ? t('auth.localNote') : t('auth.forgotNote'))}</div>
  </div></div>`;
  const f = $('#auth-form');
  f.addEventListener('submit', async e => {
    e.preventDefault(); const err = $('#auth-err'); err.textContent = '';
    const name = f.name.value.trim(), pw = f.password.value;
    if (setup) {
      if (pw.length < 6) { err.textContent = t('auth.errShort'); return; }
      if (pw !== f.password2.value) { err.textContent = t('auth.errMismatch'); return; }
      const u = await makeUser(name, pw, 'admin'); auth.users.push(u); if (!saveAuth()) return;
      startSession(u, false); toast(t('auth.welcome', {name:u.name}));
    } else {
      const u = findUserByName(name);
      const ok = u && (await hashPassword(pw, u.salt)) === u.hash;
      if (!ok) { err.textContent = t('auth.errWrong'); f.password.value = ''; f.password.focus(); return; }
      startSession(u, f.remember.checked); toast(t('auth.welcome', {name:u.name}));
    }
  });
  setTimeout(() => f.name.focus(), 30);
}

function render(){
  if (!currentUser) { renderAuth(); return; }
  document.body.classList.remove('locked');

function viewInicio(){
  const C = state.clients, Q = state.quotes, O = state.orders, today = todayISO();
  const active = C.filter(c => c.status === 'active').length;
  const prospects = C.filter(c => ['prospect','contacted','quoted'].includes(c.status)).length;
  const openQ = Q.filter(isOpenQuote);
  const byCur = {}; openQ.forEach(q => { const k = q.currency || 'ZAR'; byCur[k] = (byCur[k] || 0) + quoteTotals(q).total; });
  const curLines = Object.keys(byCur).length ? Object.entries(byCur).map(([c,v]) => fmtMoney(v,c)).join(' · ') : t('home.noPending');
  const openO = O.filter(isOpenOrder), overdue = O.filter(isOverdue);
  const fresh = !Q.length && !O.length;

  const steps = C.filter(c => c.status !== 'lost' && (c.nextStep || c.nextDate))
    .sort((a,b) => (a.nextDate||'9999').localeCompare(b.nextDate||'9999')).slice(0, 8);
  const stepsHTML = steps.length ? `<ul class="mini-list">${steps.map(c => {
      const late = c.nextDate && c.nextDate < today, isToday = c.nextDate === today;
      return `<li><div class="date ${late?'tag-red':''}">${c.nextDate ? fmtDate(c.nextDate) : esc(t('home.noDate'))}${late?`<div class="small">${esc(t('home.overdueStep'))}</div>`:isToday?`<div class="small" style="color:var(--ac2)">${esc(t('home.today'))}</div>`:''}</div>
        <div class="grow"><div class="strong step-name"><span>${esc(c.company)}${exampleTag(c)}</span>${clientNoTag(c)}</div><div class="small muted">${esc(c.nextStep || '—')}${c.contact?' · '+esc(c.contact):''}</div></div>

    : `<div class="empty">${esc(t('home.noSteps'))}</div>`;

  const upcoming = openO.slice().sort((a,b) => (a.dueDate||'9999').localeCompare(b.dueDate||'9999')).slice(0, 7);

  const backupNote = `<div class="backup-note ${(!lb || backupDays > 14) ? 'warn' : ''}">${esc(lb ? t('home.lastBackup', {date: fmtDate(lb.slice(0,10)), n: backupDays}) : t('home.noBackup'))} <button class="btn xs ghost" data-act="exportData">${esc(t('home.backupNow'))}</button></div>`;

  return `
  ${fresh ? `<div class="card welcome">${svgSized(LOGO_MARK)}<div><h1>${esc(t('home.welcomeTitle'))}</h1>

  const m = raw.match(/^#\s*0*(\d+)$/) || raw.match(/^0*(\d+)$/), no = m ? parseInt(m[1], 10) : 0, onlyNo = raw.startsWith('#');
  return state.clients.filter(c => (!ui.clientCountry || c.country === ui.clientCountry) && (!ui.clientStatus || c.status === ui.clientStatus) &&

/* ===== Foto de la pieza por línea (una por línea; JPEG comprimido como data URL dentro de la cotización) ===== */
const PHOTO_MAX_SIDE = 900, PHOTO_QUALITY = 0.7, PHOTO_TARGET = 120 * 1024, PHOTO_MAX_INPUT = 30 * 1024 * 1024;
const CAMERA_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>';
function loadImageFile(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('read')); }; im.src = url; });
}
/* Redimensiona (lado mayor ≤ 900 px) y comprime a JPEG q≈0,7; si pasa de ~120 KB baja calidad y luego tamaño; si aun así no cabe, se rechaza */
async function compressPhoto(file){
  if (!file || !/^image\//i.test(file.type || '')) throw new Error('notImage');
  if (file.size > PHOTO_MAX_INPUT) throw new Error('tooBig');
  const im = await loadImageFile(file), w0 = im.naturalWidth, h0 = im.naturalHeight;
  if (!w0 || !h0) throw new Error('read');
  let side = PHOTO_MAX_SIDE;
  while (side >= 240) {
    const k = Math.min(1, side / Math.max(w0, h0)), w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);   /* fondo blanco para PNG transparentes */
    for (const q of [PHOTO_QUALITY, 0.6, 0.5, 0.4]) { const url = cv.toDataURL('image/jpeg', q); if (dataUrlBytes(url) <= PHOTO_TARGET) return { url, w, h, q, bytes: dataUrlBytes(url) }; }
    side = Math.round(side * 0.75);
  }
  throw new Error('tooLarge');
}

function handleLogoFile(file){
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert(t('settings.errImage')); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 800, maxH = 300; let w = img.naturalWidth || 600, h = img.naturalHeight || 200;
      const k = Math.min(1, maxW / w, maxH / h); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let data; try { data = cv.toDataURL('image/png'); } catch(e) { data = reader.result; }
      if (data.length > 1500000) { alert(t('settings.errLogoBig')); return; }
      const prev = state.settings.logo; state.settings.logo = data;
      if (save()) { render(); toast(t('settings.logoUpdated')); } else state.settings.logo = prev;
    };
    img.onerror = () => alert(t('settings.errImage'));
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
/* ===== Respaldo (exportar / importar JSON). Los usuarios y contraseñas NO se exportan. ===== */
function exportData(){
  state.settings.lastBackup = new Date().toISOString(); save();
  const copy = JSON.parse(JSON.stringify(state)); delete copy.users; delete copy.auth; if (copy.settings) delete copy.settings.users;
  const data = JSON.stringify({ app:'promech-service', exportedAt:new Date().toISOString(), ...copy }, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `promech-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(t('settings.exported')); if (['inicio','ajustes'].includes(currentView())) render();
}
function importFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed; try { parsed = JSON.parse(reader.result); } catch(e) { alert(t('settings.errJson')); return; }
    if (!parsed || !Array.isArray(parsed.clients) || !Array.isArray(parsed.quotes) || !Array.isArray(parsed.orders)) { alert(t('settings.errBackup')); return; }
    if (!confirm(t('settings.confirmImport', {c: parsed.clients.length, q: parsed.quotes.length, o: parsed.orders.length}))) return;
    delete parsed.users; delete parsed.auth;              /* nunca se importan credenciales */
    const snap = JSON.stringify(state);
    state = normalize(parsed); state.flags.leadsImported = true; upgradeLeads();
    if (!save()) { state = JSON.parse(snap); render(); return; }   /* respaldo demasiado grande (fotos): se conservan los datos actuales */
    render(); toast(t('settings.imported'));
  };
  reader.readAsText(file);
}
function importLeadsAction(){
  const r = importLeads(); save(); render();
  toast(t('settings.leadsResult', {added: r.added, skipped: r.skipped}));
}

/* ===== Datos de ejemplo (claramente identificados, en el idioma actual) ===== */
function loadExample(){
  if (state.clients.some(c => c.example)) { alert(t('settings.exampleLoaded')); return; }
  if ((state.quotes.length || state.orders.length) && !confirm(t('settings.confirmExample'))) return;
  const d = todayISO(), now = new Date().toISOString(), E = {example:true, createdAt:now, updatedAt:now, createdBy: currentUser ? currentUser.name : ''}, vat = state.settings.vatDefault, U = UNITS[LANG];
  const c1 = {...E, id:uid(), company:t('ex.company1'), site:t('ex.site1'), country:'ZA', contact:t('ex.contact', {n:1}), email:'buyer@example.invalid', phone:'+27 00 000 0000', status:'active', nextStep:t('ex.step1'), nextDate:addDays(d,3), notes:t('ex.note')};
  const c2 = {...E, id:uid(), company:t('ex.company2'), site:t('ex.site2'), country:'ZM', contact:t('ex.contact', {n:2}), email:'maintenance@example.invalid', phone:'+260 00 000 0000', status:'quoted', nextStep:t('ex.step2'), nextDate:addDays(d,-2), notes:t('ex.note')};
  const c3 = {...E, id:uid(), company:t('ex.company3'), site:t('ex.site3'), country:'CD', contact:t('ex.contact', {n:3}), email:'contact@example.invalid', phone:'+243 00 000 0000', status:'prospect', nextStep:t('ex.step3'), nextDate:addDays(d,7), notes:t('ex.note')};
  const q1 = {...E, id:uid(), number:commitNumber('quote'), clientId:c1.id, clientSnapshot:snapshot(c1), date:addDays(d,-20), validityDays:30, currency:'ZAR', vatEnabled:true, vatPct:vat, status:'accepted', docLang:LANG, terms:t('ex.terms'),
    items:[{desc:t('ex.item1'), qty:2, unit:U[0], price:8500}, {desc:t('ex.item2'), qty:1, unit:U[8], price:3200}]};
  const q2 = {...E, id:uid(), number:commitNumber('quote'), clientId:c2.id, clientSnapshot:snapshot(c2), date:addDays(d,-5), validityDays:30, currency:'USD', vatEnabled:false, vatPct:vat, status:'sent', docLang:LANG, terms:'',
    items:[{desc:t('ex.item3'), qty:3, unit:U[4], price:950}]};
  const o1 = {...E, id:uid(), number:commitNumber('order'), clientId:c1.id, clientSnapshot:snapshot(c1), quoteId:q1.id, description:t('ex.item1'), material:t('ex.material1'), quantity:2, technician:t('ex.tech', {x:'A'}), priority:'high', receivedDate:addDays(d,-15), dueDate:addDays(d,-1), status:'in_progress', notes:''};
  const o2 = {...E, id:uid(), number:commitNumber('order'), clientId:c3.id, clientSnapshot:snapshot(c3), quoteId:'', description:t('ex.item4'), material:t('ex.material2'), quantity:1, technician:t('ex.tech', {x:'B'}), priority:'normal', receivedDate:addDays(d,-2), dueDate:addDays(d,10), status:'received', notes:''};
  state.clients.push(c1, c2, c3); state.quotes.push(q1, q2); state.orders.push(o1, o2);
  save(); render(); toast(t('settings.exampleDone'));
}
function removeExample(){
  if (!confirm(t('settings.confirmRemoveExample'))) return;
  state.clients = state.clients.filter(x => !x.example); state.quotes = state.quotes.filter(x => !x.example); state.orders = state.orders.filter(x => !x.example);
  save(); render(); toast(t('settings.exampleRemoved'));
}
function clearAll(){
  if (!confirm(t('settings.confirmClear'))) return;
  const word = t('settings.clearWord');
  if ((prompt(t('settings.clearPrompt', {word})) || '').trim().toUpperCase() !== word.toUpperCase()) return;
  const settings = state.settings; state = defaultState(); state.settings = {...state.settings, ...settings}; state.flags.leadsImported = true; state.flags.leadsVersion = LEADS_VERSION; save(); render(); toast(t('settings.cleared'));
}

/* ===== Ventana modal ===== */
function openModal(title, bodyHTML, {wide=false, onSave, saveLabel, titleExtra=''} = {}){
  $('#modal-root').innerHTML = `<div class="modal-backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}${titleExtra}</h2><button type="button" class="icon-btn" data-act="closeModal" aria-label="${esc(t('common.close'))}">×</button></div>
    <form id="modal-form"><div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot"><button type="button" class="btn ghost" data-act="closeModal">${esc(t('common.cancel'))}</button><button type="submit" class="btn primary">${esc(saveLabel || t('common.save'))}</button></div></form></div></div>`;
  document.body.classList.add('modal-open');
  const f = $('#modal-form');
  f.addEventListener('submit', e => { e.preventDefault(); if (onSave(f) !== false) closeModal(); });
  setTimeout(() => { if (f.contains(document.activeElement)) return; const el = f.querySelector('input:not([disabled]),select,textarea'); if (el && window.matchMedia('(min-width: 761px)').matches) el.focus(); }, 30);
}
function closeModal(){ closeLightbox(); $('#modal-root').innerHTML = ''; document.body.classList.remove('modal-open'); }

/* ===== Eventos ===== */
const ACTIONS = {
  newClient: () => openClientForm(), editClient: id => openClientForm(id), delClient: deleteClient,
  quoteForClient: id => openQuoteForm(null, {clientId:id}),
  newQuote: () => openQuoteForm(), editQuote: id => openQuoteForm(id), delQuote: deleteQuote, dupQuote: duplicateQuote,
  pdfQuote: id => openQuotePrint(id), quoteToOrder,
  newOrder: () => openOrderForm(), editOrder: id => openOrderForm(id), delOrder: deleteOrder,
  addItem: () => { $('#items').insertAdjacentHTML('beforeend', itemRow({qty:1, unit:UNITS[LANG][0]})); updateQuoteTotals(); $$('#items .i-desc').pop().focus(); },
  delItem: (id, b) => { const rows = $$('#items .item-row');
    if (rows.length <= 1) { $('.i-desc',rows[0]).value = ''; $('.i-qty',rows[0]).value = 1; $('.i-unit',rows[0]).value = UNITS[LANG][0]; $('.i-price',rows[0]).value = ''; setRowPhoto(rows[0], ''); }
    else b.closest('.item-row').remove();
    updateQuoteTotals(); },
  pickPhoto: (id, b) => { const f = $('.i-file', b.closest('.item-row')); if (f) f.click(); },
  removePhoto: (id, b) => { const r = b.closest('.item-row'); setRowPhoto(r, ''); const a = $('.photo-add', r); if (a) a.focus(); },
  viewPhoto: (id, b) => openLightbox($('.i-img', b.closest('.item-row')).value),
  closeLightbox,
  closeModal, printNow: () => window.print(), closePrint, logout,
  exportData, importData: () => { const i = $('#import-file'); i.value = ''; i.click(); },
  importLeads: importLeadsAction,
  uploadLogo: () => { const i = $('#logo-file'); i.value = ''; i.click(); },
  removeLogo: () => { state.settings.logo = ''; save(); render(); toast(t('settings.logoReset')); },
  loadExample, removeExample, clearAll,
  resetPw: id => resetUserPassword(id), delUser: id => deleteUser(id),
  moreClients: () => { ui.clientLimit += 40; refreshList(); },
  filterCountry: k => { Object.assign(ui, {clientCountry:k || '', clientStatus:'', clientQ:'', clientLimit:40}); if (currentView() === 'clientes') render(); },
  filterClients: st => { Object.assign(ui, {clientStatus:st || '', clientCountry:'', clientQ:'', clientLimit:40}); if (currentView() === 'clientes') render(); },
  filterOpenQuotes: () => { Object.assign(ui, {quoteStatus:'__open', quoteQ:''}); },
  filterOpenOrders: () => { Object.assign(ui, {orderStatus:'__open', orderQ:'', orderOnlyOverdue:false}); },
  filterOverdue: () => { Object.assign(ui, {orderOnlyOverdue:true, orderStatus:'', orderQ:''}); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACTIONS[b.dataset.act]; if (!fn) return;
  if (b.tagName !== 'A') e.preventDefault();
  fn(b.dataset.id, b, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.classList.contains('i-file')) { const f = el.files && el.files[0]; handleRowPhotoFile(el.closest('.item-row'), f); el.value = ''; return; }
  if (el.hasAttribute('data-lang-select')) { setLang(el.value); return; }
  if (el.dataset.change === 'quoteStatus') setQuoteStatus(el.dataset.id, el.value);
  if (el.dataset.change === 'orderStatus') setOrderStatus(el.dataset.id, el.value);
  /* el texto de búsqueda ya se aplica con «input»; re-renderizar aquí (al perder el foco) se comería el clic en un botón de la lista */
  if (el.dataset.filter && (el.type === 'checkbox' || el.tagName === 'SELECT')) { ui[el.dataset.filter] = el.type === 'checkbox' ? el.checked : el.value; ui.clientLimit = 40; refreshList(); }
});
document.addEventListener('input', e => { const el = e.target; if (el.dataset.filter && el.type !== 'checkbox') { ui[el.dataset.filter] = el.value; ui.clientLimit = 40; refreshList(); } });
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'settings-form') { e.preventDefault(); saveSettings(e.target); }
  if (id === 'user-form') { e.preventDefault(); addUser(e.target); }
  if (id === 'pw-form') { e.preventDefault(); changePassword(e.target); }
});
/* Pegar o soltar una imagen en la descripción de una línea = foto de esa línea */
const imageFrom = list => [...(list || [])].find(f => f && /^image\//i.test(f.type || ''));
document.addEventListener('paste', e => {
  const row = e.target.closest && e.target.closest('#items .item-row'); if (!row) return;
  const f = imageFrom(e.clipboardData && e.clipboardData.files); if (!f) return;
  e.preventDefault(); handleRowPhotoFile(row, f);
});
const hasFiles = e => !!(e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files'));
/* fuera de una línea, soltar un archivo no debe hacer que el navegador abra la imagen y abandone la app */
document.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); const row = e.target.closest && e.target.closest('#items .item-row');
  e.dataTransfer.dropEffect = row ? 'copy' : 'none'; if (row) row.classList.add('drag-over'); });
document.addEventListener('dragleave', e => { const row = e.target.closest && e.target.closest('#items .item-row'); if (row && !row.contains(e.relatedTarget)) row.classList.remove('drag-over'); });
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return; e.preventDefault();
  const row = e.target.closest && e.target.closest('#items .item-row'); if (!row) return;
  row.classList.remove('drag-over');
  const f = imageFrom(e.dataTransfer.files); if (f) handleRowPhotoFile(row, f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lightbox')) { closeLightbox(); return; } if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else if (document.body.classList.contains('print-mode')) closePrint(); } });
$('#import-file').addEventListener('change', e => importFile(e.target.files[0]));
$('#logo-file').addEventListener('change', e => handleLogoFile(e.target.files[0]));
window.addEventListener('hashchange', () => { if (document.body.classList.contains('print-mode')) closePrint(); closeModal(); render(); window.scrollTo(0,0); });
window.addEventListener('storage', e => { if (e.key === LS_KEY) { state = load(); if (currentUser) render(); } if (e.key === AUTH_KEY) { auth = loadAuth(); } });

/* ===== Arranque ===== */
LANG = detectLang(); document.documentElement.lang = LANG;
$('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(LOGO_MARK);
if (upgradeLeads()) save();   /* minas incluidas: una sola vez por dispositivo y por versión del dataset */
restoreSession();
render();
/* PWA: registrar el service worker solo cuando se sirve por http(s) (no al abrir el archivo desde el disco) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.info('Service worker:', err && err.message)); });
}
</script>
</body>
</html>
